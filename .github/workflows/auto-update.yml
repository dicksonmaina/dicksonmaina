name: Auto-Update Portfolio

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update repo metadata
        run: |
          # This workflow can be extended to auto-update topics,
          # descriptions, and README badges across all repos
          echo "Profile auto-update triggered"

      - name: Generate stats
        run: |
          curl -s https://api.github.com/users/dicksonmaina/repos?per_page=100 | \
            jq '[.[] | {name, stars: .stargazers_count, forks: .forks_count}]' \
            > stats.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "chore: update repo stats"
          git push
