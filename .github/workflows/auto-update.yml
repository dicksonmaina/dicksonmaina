name: Auto-Update Portfolio

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: *** secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update repo metadata
        run: |
          echo "Profile auto-update triggered"

      - name: Generate stats
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: token ***" \
            https://api.github.com/users/dicksonmaina/repos?per_page=100 | \
            jq "[.[] | {name, stars: .stargazers_count, forks: .forks_count}]" \
            > stats.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "chore: update repo stats"
          git push
